services:
  postgres:
    image: postgres:16-alpine
    container_name: aurel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aurel_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aurel_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
